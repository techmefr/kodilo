name: Bug report
description: A tool gives a wrong result, breaks or looks wrong.
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: tool-url
    attributes:
      label: Tool URL
      description: Filled in for you when you come from a tool page.
      placeholder: https://techmefr.github.io/kodilo/tools/jwt-decoder/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What you did, what you expected and what happened instead. A screenshot helps. Never paste real secrets, keys or personal data.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Filled in for you when you come from a tool page.
      placeholder: Firefox 131 on macOS, Chrome on Android
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Filled in for you when you come from a tool page.
      options:
        - Light
        - Dark
        - Both
        - Not sure
