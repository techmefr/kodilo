name: Tool request
description: Suggest a new tool or an improvement to an existing one.
labels: [enhancement]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: TOML Formatter
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you use it for?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Inputs, outputs and options
      description: What goes in, what comes out, and the options that matter.
  - type: checkboxes
    id: offline
    attributes:
      label: Privacy
      options:
        - label: This tool can work entirely in the browser, without sending data to a server.
